<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Форум</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #999);
    --link: var(--tg-theme-link-color, #2481cc);
    --card: var(--tg-theme-secondary-bg-color, #f5f5f5);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --danger: #e74c3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text);
         font-family:-apple-system,Roboto,sans-serif; font-size:15px; padding-bottom:80px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:8px; }
  .between { justify-content:space-between; }
  .hint { color:var(--hint); font-size:13px; }
  .title { font-weight:600; font-size:16px; margin:6px 0; cursor:pointer; }
  .body { white-space:pre-wrap; line-height:1.4; word-break:break-word; }
  button { background:var(--btn); color:var(--btn-text); border:0;
           border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:0.5; }
  button.ghost { background:transparent; color:var(--link); padding:4px 8px; }
  button.danger { background:var(--danger); }
  input, textarea, select {
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--hint);
    background:var(--bg); color:var(--text); font-size:15px; margin-bottom:8px;
    font-family:inherit;
  }
  .votes { display:flex; flex-direction:column; align-items:center;
           gap:2px; min-width:36px; }
  .votes .score { font-weight:600; font-size:14px; }
  .votes button { background:transparent; color:var(--hint); padding:2px 6px;
                  font-size:16px; line-height:1; }
  .votes button.active { color:var(--link); }
  .comment { padding-left:12px; border-left:2px solid var(--card);
             margin-left:12px; margin-top:8px; }
  .tag { display:inline-block; background:var(--btn); color:var(--btn-text);
         border-radius:6px; padding:2px 8px; font-size:12px; cursor:pointer; }
  .hidden { display:none; }
  .fab { position:fixed; right:16px; bottom:16px; width:56px; height:56px;
         border-radius:50%; font-size:26px; padding:0; box-shadow:0 4px 12px #0003;
         z-index:10; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; }
  .tabs button.inactive { background:transparent; color:var(--link); }
  .header { display:flex; align-items:center; justify-content:space-between;
            margin-bottom:12px; gap:8px; }
  .badge { background:var(--danger); color:#fff; border-radius:10px;
           padding:1px 7px; font-size:11px; font-weight:600; }
  .img { max-width:100%; border-radius:8px; margin:8px 0; display:block; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
           background:#000c; color:#fff; padding:10px 18px; border-radius:20px;
           font-size:14px; z-index:999; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .notif { padding:8px 0; border-bottom:1px solid var(--hint); }
  .
