<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RaReads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Pacifico&family=Caveat:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-img: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop');
    --text: #f0f0f0; --accent: #ffb7c5; --glass: rgba(20, 20, 30, 0.7); --border: rgba(255,255,255,0.1);
    --pattern: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
  }
  .theme-sakura { --bg-img: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1000'); --text: #fff0f5; --accent: #ff8da1; --glass: rgba(45, 27, 46, 0.7); --pattern: url('https://www.transparenttextures.com/patterns/diagmonds-light.png'); }
  .theme-sunset { --bg-img: url('https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?q=80&w=1000'); --text: #ffebd6; --accent: #ff9a76; --glass: rgba(50, 20, 10, 0.7); --pattern: url('https://www.transparenttextures.com/patterns/cubes.png'); }
  .theme-cyber { --bg-img: url('https://images.unsplash.com/photo-1555680202-c86f0e12f086?q=80&w=1000'); --text: #e0ffe0; --accent: #00ffcc; --glass: rgba(5, 10, 10, 0.8); --pattern: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
  .theme-space { --bg-img: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1000'); --text: #e0e5ff; --accent: #9bb7ff; --glass: rgba(10, 15, 30, 0.8); --pattern: url('https://www.transparenttextures.com/patterns/stardust.png'); }
  * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body { margin: 0; padding: 16px; padding-bottom: 100px; background: var(--bg-img) center/cover no-repeat fixed; color: var(--text); min-height: 100vh; transition: background 0.4s, color 0.4s; }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: -1; }
  h1, h2, h3 { font-family: 'Pacifico', cursive; font-weight: 400; }
  .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; } .between { justify-content: space-between; }
  .hint { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700; } 
  .title { font-weight: 800; font-size: 20px; margin: 10px 0; }
  button { background: var(--accent); color: #111; border: none; border-radius: 12px; padding: 12px 20px; font-weight: 800; cursor: pointer; }
  button.ghost { background: rgba(0,0,0,0.3); color: var(--accent); border: 1px solid var(--accent); }
  input, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text); margin-bottom: 12px; }
  .tag { display: inline-block; background: rgba(0,0,0,0.3); border: 1px solid var(--accent); border-radius: 10px; padding: 4px 10px; font-size: 12px; color: var(--accent); }
  .fab { position: fixed; right: 20px; bottom: 30px; width: 64px; height: 64px; border-radius: 50%; font-size: 32px; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #111; }
  .fab-profile { position: fixed; left: 20px; bottom: 30px; width: 64px; height: 64px; border-radius: 50%; font-size: 24px; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 2px solid var(--accent); color: var(--accent); }
  .reaction-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 20px; padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text); }
  .reaction-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .level-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .level-fill { height: 100%; background: var(--accent); width: 0%; }
  .loading { text-align: center; color: var(--accent); margin-top: 60px; font-size: 20px; font-weight: 800; }
  .red-dot { width: 10px; height: 10px; background: red; border-radius: 50%; display: inline-block; margin-left: 4px; box-shadow: 0 0 10px red; }
  .status-online { color: #00ff88; font-weight: 700; }
  .status-offline { color: #888; font-weight: 700; }
  .status-banned { color: #ff4444; font-weight: 700; }
  .status-frozen { color: #00f0ff; font-weight: 700; }
  .frame-gold { border: 4px solid #ffd700; box-shadow: 0 0 15px #ffd700, inset 0 0 20px #ffd70088; }
  .frame-fire { border: 4px solid #ff4500; box-shadow: 0 0 20px #ff4500; }
  .frame-sakura { border: 4px solid #ffb7c5; box-shadow: 0 0 20px #ffb7c5; }
  .frame-anime { border: 4px solid #ff007f; box-shadow: 0 0 25px #ff007f, 0 0 40px #00f0ff; }
  .frame-neon { border: 4px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
  .frame-galaxy { border: 4px solid #9bb7ff; box-shadow: 0 0 20px #9bb7ff, 0 0 40px #fff; }
  .frame-stars { border: 4px solid #fff; box-shadow: 0 0 15px #fff, 0 0 30px #ffd700; }
  .frame-rainbow { border: 4px solid transparent; background: linear-gradient(#000,#000) padding-box, linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet) border-box; }
  .profile-pattern { position: relative; border-radius: 20px; overflow: hidden; }
  .profile-pattern::before { content: ''; position: absolute; inset: 0; background-image: var(--pattern); background-size: 200px; opacity: 0.08; pointer-events: none; z-index: 0; }
  .profile-pattern > * { position: relative; z-index: 1; }
  .post-style-handwriting { font-family: 'Caveat', cursive; font-size: 22px; }
  .post-style-pixel { font-family: 'Press Start 2P', cursive; font-size: 12px; line-height: 1.8; }
  .post-style-elegant { font-family: 'Pacifico', cursive; }
  .roulette-container { position: relative; width: 260px; height: 260px; margin: 20px auto; }
  .roulette-wheel { width: 260px; height: 260px; border-radius: 50%; background: conic-gradient(#ff007f 0deg 36deg, #00f0ff 36deg 72deg, #ffd700 72deg 108deg, #ff4500 108deg 144deg, #9bb7ff 144deg 180deg, #00ff88 180deg 216deg, #ff69b4 216deg 252deg, #8a2be2 252deg 288deg, #ffa500 288deg 324deg, #00ced1 324deg 360deg); transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); box-shadow: 0 0 30px rgba(255,255,255,0.3); }
  .roulette-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #fff; text-shadow: 0 0 10px #000; z-index: 2; }
  .roulette-labels { position: absolute; inset: 0; pointer-events: none; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
  .roulette-label { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 0 3px #000; }
  .rocket-track { position: relative; height: 300px; background: linear-gradient(to top, #000022, #000044, #000066); border-radius: 16px; overflow: hidden; margin: 16px 0; }
  .rocket-icon { position: absolute; font-size: 40px; transition: bottom 0.1s linear; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 0 10px #ffaa00); }
  .rocket-stars { position: absolute; inset: 0; background-image: radial-gradient(white 1px, transparent 1px); background-size: 30px 30px; opacity: 0.3; }
  .case-track { position: relative; height: 80px; background: rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; margin: 16px 0; }
  .case-items { display: flex; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
  .case-item { min-width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 32px; border-right: 1px solid rgba(255,255,255,0.1); }
  .case-arrow { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: red; box-shadow: 0 0 10px red; z-index: 2; }
  .game-font { font-family: 'Press Start 2P', cursive; }
</style>
</head>
<body>
<audio id="bg-music" loop></audio>
<div id="root"><div class="loading">Загрузка RaReads ⛩️</div></div>
<script>
  const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
  const INIT = tg.initData; const ME = tg.initDataUnsafe?.user || {};
  if (!INIT) document.body.innerHTML = '<div style="color:red;text-align:center;margin-top:50px">Открой через Telegram!</div>';
  const { useState, useEffect, useRef, createElement: e } = React;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT, ...(opts.headers||{}) } });
    if (!r.ok) {
      let msg = 'Ошибка сервера';
      try { const j = await r.json(); msg = j.detail || msg; } catch { msg = 'Ошибка ' + r.status; }
      throw new Error(msg);
    }
    return r.json();
  }

  function timeMsk(dateStr) {
    if (!dateStr) return '';
    try {
      const d = new Date(dateStr + 'Z');
      return d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
    } catch { return ''; }
  }

  function statusInfo(lastSeen, isBanned, isFrozen) {
    if (isBanned) return { text: '🚫 забанен', cls: 'status-banned' };
    if (isFrozen) return { text: '❄️ заморожен', cls: 'status-frozen' };
    if (!lastSeen) return { text: 'не в сети', cls: 'status-offline' };
    try {
      const d = new Date(lastSeen + 'Z');
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return { text: 'в сети', cls: 'status-online' };
      if (diff < 3600) return { text: `${Math.floor(diff/60)} мин назад`, cls: 'status-offline' };
      if (diff < 86400) return { text: `${Math.floor(diff/3600)} ч назад`, cls: 'status-offline' };
      return { text: `${Math.floor(diff/86400)} дн назад`, cls: 'status-offline' };
    } catch { return { text: 'не в сети', cls: 'status-offline' }; }
  }

  function CommentItem({ c, onProfile, postAuthorId, onReply }) {
    const react = async (emoji) => { await api('/api/react', { method:'POST', body: JSON.stringify({ target_type: 'comment', target_id: c.id, emoji }) }); };
    const vote = async (val) => { await api('/api/vote', { method:'POST', body: JSON.stringify({ target_type: 'comment', target_id: c.id, value: val }) }); };
    const bodyHtml = (c.body || '').replace(/\[sticker\](.*?)\[\/sticker\]/g, (m, fid) => `<br><img src="/api/sticker/${fid}" style="width:100px;height:100px;border-radius:12px;margin-top:8px;">`);
    return e('div', { className: 'card', style: {padding: 12, marginBottom: 8, marginLeft: c.parent_id ? 20 : 0} },
      e('div', { className: 'row between' },
        e('span', { className: 'hint', onClick: () => onProfile(c.author_id) }, `${c.badge || ''} @${c.custom_nick || c.username} ${c.author_id === postAuthorId ? '👑' : ''} · ${timeMsk(c.created_at)}`),
        e('div', { style: {display: 'flex', gap: 4} },
          e('button', { className: 'ghost', style: {padding: '2px 6px', fontSize: 10}, onClick: () => vote(1) }, '▲'),
          e('span', { style: {fontSize: 12, color: 'var(--accent)'} }, c.score || 0),
          e('button', { className: 'ghost', style: {padding: '2px 6px', fontSize: 10}, onClick: () => vote(-1) }, '▼')
        )
      ),
      e('div', { style: {marginTop: 4, fontSize: 14}, dangerouslySetInnerHTML: {__html: bodyHtml} }),
      e('div', { style: {marginTop: 8, display: 'flex', gap: 6, alignItems: 'center'} },
        ['💖', '😂', '🔥'].map(r => e('button', {key: r, className: 'reaction-btn', onClick: () => react(r), style: {padding: '2px 6px', fontSize: 12}}, r)),
        e('button', {className: 'ghost', onClick: () => onReply(c.id), style: {padding: '2px 6px', fontSize: 10}}, 'Ответить')
      )
    );
  }

  function PostView({ id, onBack, onProfile, theme }) {
    const [data, setData] = useState(null); const [text, setText] = useState(''); const [replyTo, setReplyTo] = useState(null); const [fileId, setFileId] = useState(null);
    const [adultConfirmed, setAdultConfirmed] = useState(false);
    const load = () => api('/api/posts/' + id).then(setData).catch(err => alert(err.message));
    useEffect(() => { load(); }, [id]);
    if (!data) return e('div', {className:'loading'}, 'Читаем...');
    const { post, comments } = data;

    if (post.is_adult && !adultConfirmed) {
      return e('div', {className: `theme-${theme}`},
        e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
        e('div', {className: 'card', style: {textAlign: 'center'}},
          e('h2', null, '⚠️ 18+'),
          e('p', null, 'Этот пост содержит контент для взрослых. Тебе есть 18 лет?'),
          e('button', { onClick: () => setAdultConfirmed(true), style: {width: '100%'} }, 'Да, мне есть 18')
        )
      );
    }

    const uploadFile = async (ev) => {
      const f = ev.target.files[0]; if(!f) return;
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/upload', { method:'POST', headers: {'X-Init-Data': INIT}, body: fd }).then(r => r.json());
      setFileId(res.file_id);
    };
    const submit = async () => {
      if(!text.trim() && !fileId) return;
      try { await api('/api/comments', { method:'POST', body: JSON.stringify({ post_id: id, parent_id: replyTo, body: text, file_id: fileId }) }); setText(''); setFileId(null); setReplyTo(null); load(); }
      catch(err) { alert(err.message); }
    };
    const react = async (emoji) => { try { await api('/api/react', { method:'POST', body: JSON.stringify({ target_type: 'post', target_id: id, emoji }) }); load(); } catch(err) { alert(err.message); } };
    const vote = async (val) => { try { await api('/api/vote', { method:'POST', body: JSON.stringify({ target_type: 'post', target_id: id, value: val }) }); load(); } catch(err) { alert(err.message); } };
    const del = async () => { if(confirm('Удалить?')) { await api('/api/posts/' + id, { method: 'DELETE' }); onBack(); } };
    const share = async () => {
      try {
        const r = await api('/api/share', {method:'POST', body: JSON.stringify({post_id: id})});
        if (tg.shareMessage) { tg.shareMessage(r.url); } else { alert('Ссылка: ' + r.url); }
      } catch(err) { alert(err.message); }
    };

    const styleClass = post.style === 'handwriting' ? 'post-style-handwriting' : post.style === 'pixel' ? 'post-style-pixel' : post.style === 'elegant' ? 'post-style-elegant' : '';

    return e('div', {className: `theme-${theme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
      e('div', { className: 'card' },
        e('div', { className: 'row between' },
          e('span', { className: 'tag' }, (post.tags || 'general').split(',').map(t => '#'+t.trim()).join(' ')),
          e('span', { className: 'hint', onClick: () => onProfile(post.author_id) }, `${post.is_anonymous ? '🕶️ Аноним' : `${post.badge || ''} @${post.custom_nick || post.username}`} · ${timeMsk(post.created_at)}`)
        ),
        e('h2', { className: 'title ' + styleClass }, post.title),
        post.image_file_id && e('img', { src: '/api/image/' + post.id, style: {width:'100%', borderRadius:12, marginBottom:12} }),
        e('div', { className: styleClass, style:{whiteSpace:'pre-wrap', lineHeight:1.6, fontSize:15} }, post.body),
        e('div', { style: {display:'flex', gap:8, marginTop:16, flexWrap: 'wrap'} }, ['💖', '😂', '🔥', '😭', '👎', '🤔'].map(r => e('button', { key: r, className: 'reaction-btn' + (post.my_reactions?.includes(r) ? ' active' : ''), onClick: () => react(r) }, r))),
        e('div', { className: 'row between', style:{marginTop:20} },
          e('div', { style: {display:'flex', alignItems:'center', gap:10} },
            e('button', { className: 'ghost', onClick: () => vote(1) }, '▲'),
            e('span', { style: {fontWeight:900, fontSize:18, color:'var(--accent)'} }, post.score),
            e('button', { className: 'ghost', onClick: () => vote(-1) }, '▼')
          ),
          e('span', { className: 'hint' }, `👁 ${post.views}`)
        ),
        e('div', { className: 'row', style: {marginTop: 16, gap: 8} },
          e('button', { className: 'ghost', onClick: share }, '🔗 Поделиться'),
          (post.author_id === ME.id || ME.id === 5024935475) && e('button', { className: 'ghost', onClick: del, style: {color: 'red', borderColor: 'red'} }, '🗑 Удалить')
        )
      ),
      e('h3', { style: {color: 'var(--accent)'} }, '💬 Комментарии'),
      replyTo && e('div', {className: 'hint', onClick: () => setReplyTo(null), style:{marginBottom:8, cursor:'pointer'}}, 'Ответ на #' + replyTo + ' ✕'),
      e('textarea', { rows: 2, placeholder: 'Написать...', value: text, onChange: ev => setText(ev.target.value) }),
      e('div', {style: {display:'flex', gap: 10, marginBottom: 12, alignItems:'center'}},
        e('input', { type: 'file', accept: 'image/*,image/gif', onChange: uploadFile, style:{color:'#fff', flex:1} }),
        fileId && e('span', {className:'hint'}, '✓ Файл готов')
      ),
      e('button', { onClick: submit, style: {marginBottom: 20, width: '100%'} }, 'Отправить'),
      comments.map(c => e(CommentItem, { key: c.id, c, onProfile, postAuthorId: post.author_id, onReply: setReplyTo }))
    );
  }

  function Profile({ userId, onBack, theme }) {
    const [profile, setProfile] = useState(null); const [editMode, setEditMode] = useState(false);
    const [nick, setNick] = useState(''); const [bio, setBio] = useState('');
    const [shopOpen, setShopOpen] = useState(false); const [bannerOpen, setBannerOpen] = useState(false);
    const [bannerIndex, setBannerIndex] = useState(0);
    const [giftTarget, setGiftTarget] = useState(''); const [giftType, setGiftType] = useState('heart'); const [giftDesc, setGiftDesc] = useState('');
    const [banners, setBanners] = useState([]);

    const load = () => api('/api/profile/' + (userId || ME.id)).then(p => { 
      setProfile(p); setNick(p.custom_nick || ''); setBio(p.bio || ''); 
    }).catch(err => alert(err.message));
    useEffect(() => { load(); api('/api/banners').then(setBanners).catch(()=>{}); }, [userId]);

    if (!profile) return e('div', {className:'loading'}, 'Загрузка профиля...');

    const isMe = profile.id === ME.id;
    const save = async () => { await api('/api/profile', { method:'POST', body: JSON.stringify({ custom_nick: nick, bio: bio }) }); setEditMode(false); load(); };
    const buyFrame = async (f) => { try { await api('/api/buy_frame?frame='+f, {method:'POST'}); load(); } catch(err) { alert(err.message); } };
    const equipFrame = async (f) => { try { await api('/api/equip_frame?frame='+f, {method:'POST'}); load(); } catch(err) { alert(err.message); } };
    const buyBanner = async (bid) => { try { await api('/api/buy_banner?banner_id='+bid, {method:'POST'}); load(); } catch(err) { alert(err.message); } };
    const buyGift = async () => { if(!giftTarget) return; try { await api('/api/buy_gift', { method:'POST', body: JSON.stringify({ to_id: parseInt(giftTarget), gift: giftType, description: giftDesc }) }); alert('Подарок отправлен!'); load(); } catch(err) { alert(err.message); } };

    const avatarUrl = profile.avatar ? `/api/avatar/${profile.avatar}` : `https://api.dicebear.com/7.x/adventurer/svg?seed=${profile.id}`;
    const refLink = `https://t.me/${tg.initDataUnsafe?.start_param ? 'bot' : 'bot'}?start=ref_${profile.id}`;
    const st = statusInfo(profile.last_seen, profile.is_banned, profile.is_frozen);
    const currentBanner = banners[bannerIndex];

    const frameList = [
      { key: 'gold', name: '🥇 Золото', price: 50 },
      { key: 'fire', name: '🔥 Огонь', price: 1
