<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anime Forum</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Аниме-стилистика: темная тема, неон, стекло */
  :root {
    --bg: #0b0c10;
    --bg-gradient: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
    --glass: rgba(31, 40, 51, 0.6);
    --border: rgba(102, 252, 241, 0.2);
    --text: #c5c6c7;
    --accent: #66fcf1;
    --accent-dark: #45a29e;
    --danger: #ff4c4c;
    --hint: #7f8c8d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px; padding-bottom: 90px;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    min-height: 100vh;
  }
  /* Стеклянная карточка */
  .card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 10px rgba(102, 252, 241, 0.05);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:active { transform: scale(0.98); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .hint { color: var(--hint); font-size: 13px; }
  .title { font-weight: 700; font-size: 18px; margin: 8px 0; color: #fff; text-shadow: 0 0 5px rgba(102,252,241,0.3); }
  .body { white-space: pre-wrap; line-height: 1.5; word-break: break-word; }

  /* Кнопки */
  button {
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    color: #0b0c10;
    border: 0; border-radius: 12px; padding: 10px 16px;
    font-size: 15px; font-weight: bold; cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
  }
  button:disabled { opacity: 0.5; box-shadow: none; }
  button.ghost {
    background: transparent; color: var(--accent); box-shadow: none;
    border: 1px solid var(--border); padding: 6px 12px;
  }
  button.ghost:active { background: rgba(102, 252, 241, 0.1); }
  button.danger { background: linear-gradient(90deg, #a00, var(--danger)); color: #fff; box-shadow: 0 0 10px rgba(255, 76, 76, 0.4); }

  /* Поля ввода */
  input, textarea, select {
    width: 100%; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3); color: var(--accent);
    font-size: 15px; margin-bottom: 10px; font-family: inherit;
    outline: none; transition: border 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(102, 252, 241, 0.2); }

  /* Голосование */
  .votes { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 36px; }
  .votes .score { font-weight: 800; font-size: 15px; color: var(--accent); text-shadow: 0 0 5px var(--accent); }
  .votes button { background: transparent; color: var(--hint); padding: 0; font-size: 20px; line-height: 1; box-shadow: none; }
  .votes button.active { color: var(--accent); text-shadow: 0 0 8px var(--accent); }

  /* Комментарии */
  .comment { padding-left: 12px; border-left: 2px solid var(--border); margin-left: 12px; margin-top: 10px; }
  .tag { display: inline-block; background: rgba(102, 252, 241, 0.1); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 600; }

  /* Табы (Новое/Топ) */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; background: transparent; color: var(--hint); box-shadow: none; padding: 8px; font-size: 14px; }
  .tabs button.active { background: rgba(102, 252, 241, 0.15); color: var(--accent); text-shadow: 0 0 5px var(--accent); }

  /* Кнопка плюс (FAB) и Профиль */
  .fab {
    position: fixed; right: 20px; bottom: 20px; width: 60px; height: 60px;
    border-radius: 50%; font-size: 30px; padding: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
  }
  .fab-profile {
    position: fixed; left: 20px; bottom: 20px; width: 60px; height: 60px;
    border-radius: 50%; font-size: 24px; padding: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--border); color: var(--accent);
    box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
  }

  /* Утилиты */
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--accent); margin-top: 50px; font-size: 18px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--accent); } 100% { opacity: 0.5; } }
  .error-box { background: rgba(255, 76, 76, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const INIT = tg.initData;

// Проверка на наличие initData
if (!INIT) {
  document.getElementById('root').innerHTML = '<div class="error-box">Ошибка: Приложение открыто вне Telegram!<br>Пожалуйста, откройте его через кнопку в боте.</div>';
  throw new Error("No initData");
}

const { useState, useEffect } = React;
const REACT_E = React.createElement;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT, ...(opts.headers || {}) }
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status}: ${txt}`);
  }
  return r.json();
}

// --- Компоненты ---
function PostList({ onOpen, setView }) {
  const [posts, setPosts] = useState(null);
  const [error, setError] = useState(null);
  const [sort, setSort] = useState('new');

  useEffect(() => {
    setPosts(null); setError(null);
    api(`/api/posts?sort=${sort}&page=1`)
      .then(d => setPosts(d.posts))
      .catch(e => setError(e.message));
  }, [sort]);

  if (error) return REACT_E('div', {className:'error-box'}, 'Не удалось загрузить посты: ', error);
  if (!posts) return REACT_E('div', {className:'loading'}, 'Загрузка...');

  return REACT_E('div', null,
    REACT_E('div', { className: 'row between', style: {marginBottom: 16} },
      REACT_E('h2', { style: {margin: 0, color: 'var(--accent)', textShadow: '0 0 10px var(--accent-dark)'} }, '⛩️ Аниме-Форум'),
      REACT_E('button', { className: 'ghost', onClick: () => setView('notifications') }, '🔔')
    ),
    REACT_E('div', { className: 'tabs' },
      ['new', 'top'].map(s => REACT_E('button', { key: s, className: sort === s ? 'active' : '', onClick: () => setSort(s) }, s === 'new' ? '🆕 Новое' : '🔥 Топ'))
    ),
    posts.length === 0 ? REACT_E('p', {className:'hint', style:{textAlign:'center'}}, 'Пока нет постов. Создай первый!') :
    posts.map(p => REACT_E('div', { key: p.id, className: 'card', onClick: () => onOpen(p.id) },
      REACT_E('div', { className: 'row', style: {marginBottom: 8} },
        REACT_E('span', { className: 'tag' }, p.tag),
        REACT_E('span', { className: 'hint' }, `@${p.username || p.first_name || 'anon'}`)
      ),
      REACT_E('div', { className: 'title' }, p.title),
      REACT_E('div', { className: 'hint' }, `▲ ${p.score} · 💬 ${p.comments} · 👁 ${p.views}`)
    ))
  );
}

function PostView({ id, onBack }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [text, setText] = useState('');

  const load = () => {
    api('/api/posts/' + id).then(setData).catch(e => setError(e.message));
  };
  useEffect(load, [id]);

  if (error) return REACT_E('div', {className:'error-box'}, 'Ошибка загрузки поста: ', error);
  if (!data) return REACT_E('div', {className:'loading'}, 'Загрузка...');

  const { post, comments } = data;

  const submitComment = async () => {
    if (!text.trim()) return;
    try {
      await api('/api/comments', { method:'POST', body: JSON.stringify({ post_id: id, parent_id: null, body: text }) });
      setText(''); load();
    } catch(e) { alert(e.message); }
  };

  return REACT_E('div', null,
    REACT_E('button', { className: 'ghost', onClick: onBack, style: {marginBottom: 12} }, '← Назад'),
    REACT_E('div', { className: 'card' },
      REACT_E('div', { className: 'row between' },
        REACT_E('span', { className: 'tag' }, post.tag),
        REACT_E('span', { className: 'hint' }, `⭐ Карма автора: ${post.author_karma}`)
      ),
      REACT_E('h2', { className: 'title' }, post.title),
      REACT_E('div', { className: 'body' }, post.body),
      REACT_E('div', { className: 'row between', style: {marginTop: 16} },
        REACT_E('div', { className: 'votes' },
          REACT_E('button', { onClick: () => api('/api/vote', {method:'POST', body:JSON.stringify({target_type:'post', target_id:post.id, value:1})}).then(load) }, '▲'),
          REACT_E('span', { className: 'score' }, post.score),
          REACT_E('button', { onClick: () => api('/api/vote', {method:'POST', body:JSON.stringify({target_type:'post', target_id:post.id, value:-1})}).then(load) }, '▼')
        ),
        REACT_E('span', { className: 'hint' }, `Просмотры: ${post.views}`)
      )
    ),
    REACT_E('h3', { style: {color: 'var(--accent)'} }, '💬 Комментарии'),
    REACT_E('textarea', { rows: 2, placeholder: 'Твой комментарий...', value: text, onChange: e => setText(e.target.value) }),
    REACT_E('button', { onClick: submitComment, style: {marginBottom: 16} }, 'Отправить'),
    comments.map(c => REACT_E('div', { key: c.id, className: 'comment' },
      REACT_E('div', { className: 'hint' }, `@${c.username || c.first_name} (⭐${c.author_karma})`),
      REACT_E('div', { className: 'body', style: {color: '#fff'} }, c.body)
    ))
  );
}

function Compose({ onBack, onCreated }) {
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [tag, setTag] = useState('general');

  const submit = async () => {
    if (!title.trim()) return alert('Введи заголовок');
    try {
      const r = await api('/api/posts', { method:'POST', body: JSON.stringify({ title, body, tag }) });
      onCreated(r.id);
    } catch(e) { alert(e.message); }
  };

  return REACT_E('div', null,
    REACT_E('button', { className: 'ghost', onClick: onBack }, '← Отмена'),
    REACT_E('h2', { style: {color: 'var(--accent)'} }, 'Создать пост'),
    REACT_E('input', { placeholder: 'Заголовок', value: title, onChange: e => setTitle(e.target.value) }),
    REACT_E('input', { placeholder: 'Тег (например, anime)', value: tag, onChange: e => setTag(e.target.value) }),
    REACT_E('textarea', { rows: 6, placeholder: 'Текст поста...', value: body, onChange: e => setBody(e.target.value) }),
    REACT_E('button', { onClick: submit, style: {width:'100%'} }, 'Опубликовать')
  );
}

function App() {
  const [route, setRoute] = useState({ view: 'list' });

  if (route.view === 'post') return REACT_E(PostView, { id: route.id, onBack: () => setRoute({view: 'list'}) });
  if (route.view === 'compose') return REACT_E(Compose, { onBack: () => setRoute({view:'list'}), onCreated: id => setRoute({view:'post', id}) });

  return REACT_E('div', null,
    REACT_E(PostList, { onOpen: id => setRoute({view:'post', id}), setView: v => setRoute({view: v}) }),
    REACT_E('button', { className: 'fab', onClick: () => setRoute({view:'compose'}) }, '+'),
    REACT_E('button', { className: 'fab-profile', onClick: () => alert('Профиль в разработке') }, '👤')
  );
}

// Обязательно подключаем React в начале файла!
const script1 = document.createElement('script');
script1.src = "https://unpkg.com/react@18/umd/react.production.min.js";
document.head.appendChild(script1);
const script2 = document.createElement('script');
script2.src = "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js";
document.head.appendChild(script2);

script2.onload = () => {
  ReactDOM.createRoot(document.getElementById('root')).render(REACT_E(App));
};
</script>
</body>
</html>
