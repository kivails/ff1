<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RaReads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --bg-img: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop'); --text: #f0f0f0; --accent: #ffb7c5; --glass: rgba(20, 20, 30, 0.7); --border: rgba(255,255,255,0.1); }
  .theme-sakura { --bg-img: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1000'); --text: #fff0f5; --accent: #ff8da1; --glass: rgba(45, 27, 46, 0.7); }
  .theme-sunset { --bg-img: url('https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?q=80&w=1000'); --text: #ffebd6; --accent: #ff9a76; --glass: rgba(50, 20, 10, 0.7); }
  .theme-cyber { --bg-img: url('https://images.unsplash.com/photo-1555680202-c86f0e12f086?q=80&w=1000'); --text: #e0ffe0; --accent: #00ffcc; --glass: rgba(5, 10, 10, 0.8); }
  .theme-space { --bg-img: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1000'); --text: #e0e5ff; --accent: #9bb7ff; --glass: rgba(10, 15, 30, 0.8); }
  * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body { margin: 0; padding: 16px; padding-bottom: 100px; background: var(--bg-img) center/cover no-repeat fixed; color: var(--text); min-height: 100vh; transition: background 0.4s, color 0.4s; }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: -1; }
  h1, h2, h3 { font-family: 'Pacifico', cursive; font-weight: 400; }
  .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; } .between { justify-content: space-between; }
  .hint { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700; } 
  .title { font-weight: 800; font-size: 20px; margin: 10px 0; }
  button { background: var(--accent); color: #111; border: none; border-radius: 12px; padding: 12px 20px; font-weight: 800; cursor: pointer; }
  button.ghost { background: rgba(0,0,0,0.3); color: var(--accent); border: 1px solid var(--accent); }
  input, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text); margin-bottom: 12px; }
  .tag { display: inline-block; background: rgba(0,0,0,0.3); border: 1px solid var(--accent); border-radius: 10px; padding: 4px 10px; font-size: 12px; color: var(--accent); }
  .fab { position: fixed; right: 20px; bottom: 30px; width: 64px; height: 64px; border-radius: 50%; font-size: 32px; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #111; }
  .fab-profile { position: fixed; left: 20px; bottom: 30px; width: 64px; height: 64px; border-radius: 50%; font-size: 24px; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 2px solid var(--accent); color: var(--accent); }
  .reaction-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 20px; padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text); }
  .reaction-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .frame-gold { border: 4px solid #ffd700; box-shadow: 0 0 15px #ffd700; }
  .frame-fire { border: 4px solid #ff4500; box-shadow: 0 0 15px #ff4500; }
  .frame-sakura { border: 4px solid #ffb7c5; box-shadow: 0 0 15px #ffb7c5; }
  .frame-anime { border: 4px solid #ff007f; box-shadow: 0 0 20px #ff007f, 0 0 40px #00f0ff; }
  .frame-neon { border: 4px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
  .level-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .level-fill { height: 100%; background: var(--accent); width: 0%; }
  .loading { text-align: center; color: var(--accent); margin-top: 60px; font-size: 20px; font-weight: 800; }
  .red-dot { width: 10px; height: 10px; background: red; border-radius: 50%; display: inline-block; margin-left: 4px; box-shadow: 0 0 10px red; }
</style>
</head>
<body>
<audio id="bg-music" loop></audio>
<div id="root"><div class="loading">Загрузка RaReads ⛩️</div></div>
<script>
  const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
  const INIT = tg.initData; const ME = tg.initDataUnsafe?.user || {};
  if (!INIT) document.body.innerHTML = '<div style="color:red;text-align:center;margin-top:50px">Открой через Telegram!</div>';
  const { useState, useEffect, createElement: e } = React;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT, ...(opts.headers||{}) } });
    if (!r.ok) {
      let msg = 'Ошибка сервера';
      try { const j = await r.json(); msg = j.detail || msg; } catch { msg = 'Ошибка ' + r.status; }
      throw new Error(msg);
    }
    return r.json();
  }

  function timeMsk(dateStr) {
    const d = new Date(dateStr + 'Z');
    return d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
  }

  function CommentItem({ c, onProfile, postAuthorId, onReply }) {
    const react = async (emoji) => { await api('/api/react', { method:'POST', body: JSON.stringify({ target_type: 'comment', target_id: c.id, emoji }) }); };
    const vote = async (val) => { await api('/api/vote', { method:'POST', body: JSON.stringify({ target_type: 'comment', target_id: c.id, value: val }) }); };
    const bodyHtml = c.body.replace(/\[sticker\](.*?)\[\/sticker\]/g, (m, fid) => `<br><img src="/api/sticker/${fid}" style="width:100px;height:100px;border-radius:12px;margin-top:8px;">`);
    return e('div', { className: 'card', style: {padding: 12, marginBottom: 8, marginLeft: c.parent_id ? 20 : 0} },
      e('div', { className: 'row between' },
        e('span', { className: 'hint', onClick: () => onProfile(c.author_id) }, `${c.badge || ''} @${c.custom_nick || c.username} ${c.author_id === postAuthorId ? '👑' : ''} · ${timeMsk(c.created_at)}`),
        e('div', { style: {display: 'flex', gap: 4} },
          e('button', { className: 'ghost', style: {padding: '2px 6px', fontSize: 10}, onClick: () => vote(1) }, '▲'),
          e('span', { style: {fontSize: 12, color: 'var(--accent)'} }, c.score || 0),
          e('button', { className: 'ghost', style: {padding: '2px 6px', fontSize: 10}, onClick: () => vote(-1) }, '▼')
        )
      ),
      e('div', { style: {marginTop: 4, fontSize: 14}, dangerouslySetInnerHTML: {__html: bodyHtml} }),
      e('div', { style: {marginTop: 8, display: 'flex', gap: 6, alignItems: 'center'} },
        ['💖', '😂', '🔥'].map(r => e('button', {key: r, className: 'reaction-btn', onClick: () => react(r), style: {padding: '2px 6px', fontSize: 12}}, r)),
        e('button', {className: 'ghost', onClick: () => onReply(c.id), style: {padding: '2px 6px', fontSize: 10}}, 'Ответить')
      )
    );
  }

  function PostView({ id, onBack, onProfile, theme }) {
    const [data, setData] = useState(null); const [text, setText] = useState(''); const [replyTo, setReplyTo] = useState(null); const [fileId, setFileId] = useState(null);
    const load = () => api('/api/posts/' + id).then(setData);
    useEffect(() => { load(); }, [id]);
    if (!data) return e('div', {className:'loading'}, 'Читаем...');
    const { post, comments } = data;

    const uploadFile = async (e) => {
      const f = e.target.files[0]; if(!f) return;
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/upload', { method:'POST', headers: {'X-Init-Data': INIT}, body: fd }).then(r => r.json());
      setFileId(res.file_id);
    };
    const submit = async () => {
      if(!text.trim() && !fileId) return;
      try {
        await api('/api/comments', { method:'POST', body: JSON.stringify({ post_id: id, parent_id: replyTo, body: text, file_id: fileId }) });
        setText(''); setFileId(null); setReplyTo(null); load();
      } catch(e) { alert(e.message); }
    };
    const react = async (emoji) => { try { await api('/api/react', { method:'POST', body: JSON.stringify({ target_type: 'post', target_id: id, emoji }) }); load(); } catch(e) { alert(e.message); } };
    const vote = async (val) => { try { await api('/api/vote', { method:'POST', body: JSON.stringify({ target_type: 'post', target_id: id, value: val }) }); load(); } catch(e) { alert(e.message); } };
    const del = async () => { if(confirm('Удалить?')) { await api('/api/posts/' + id, { method: 'DELETE' }); onBack(); } };

    return e('div', {className: `theme-${theme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
      e('div', { className: 'card' },
        e('div', { className: 'row between' },
          e('span', { className: 'tag' }, post.tags.split(',').map(t => '#'+t.trim()).join(' ')),
          e('span', { className: 'hint', onClick: () => onProfile(post.author_id) }, `${post.is_anonymous ? '🕶️ Аноним' : `${post.badge || ''} @${post.custom_nick || post.username}`} · ${timeMsk(post.created_at)}`)
        ),
        e('h2', { className: 'title' }, post.title),
        post.image_file_id && e('img', { src: '/api/image/' + post.id, style: {width:'100%', borderRadius:12, marginBottom:12} }),
        e('div', { style:{whiteSpace:'pre-wrap', lineHeight:1.6, fontSize:15} }, post.body),
        e('div', { style: {display:'flex', gap:8, marginTop:16, flexWrap: 'wrap'} }, ['💖', '😂', '🔥', '😭', '👎', '🤔'].map(r => e('button', { key: r, className: 'reaction-btn' + (post.my_reactions?.includes(r) ? ' active' : ''), onClick: () => react(r) }, r))),
        e('div', { className: 'row between', style:{marginTop:20} },
          e('div', { style: {display:'flex', alignItems:'center', gap:10} },
            e('button', { className: 'ghost', onClick: () => vote(1) }, '▲'),
            e('span', { style: {fontWeight:900, fontSize:18, color:'var(--accent)'} }, post.score),
            e('button', { className: 'ghost', onClick: () => vote(-1) }, '▼')
          ),
          e('span', { className: 'hint' }, `👁 ${post.views}`)
        ),
        (post.author_id === ME.id || ME.id === 5024935475) && e('button', { className: 'ghost', onClick: del, style: {marginTop: 16, color: 'red', borderColor: 'red'} }, '🗑 Удалить')
      ),
      e('h3', { style: {color: 'var(--accent)'} }, '💬 Комментарии'),
      replyTo && e('div', {className: 'hint', onClick: () => setReplyTo(null), style:{marginBottom:8, cursor:'pointer'}}, 'Ответ на #' + replyTo + ' ✕'),
      e('textarea', { rows: 2, placeholder: 'Написать...', value: text, onChange: ev => setText(ev.target.value) }),
      e('div', {style: {display:'flex', gap: 10, marginBottom: 12, alignItems:'center'}},
        e('input', { type: 'file', accept: 'image/*,image/gif', onChange: uploadFile, style:{color:'#fff', flex:1} }),
        fileId && e('span', {className:'hint'}, '✓ Файл готов')
      ),
      e('button', { onClick: submit, style: {marginBottom: 20, width: '100%'} }, 'Отправить'),
      comments.map(c => e(CommentItem, { key: c.id, c, onProfile, postAuthorId: post.author_id, onReply: setReplyTo }))
    );
  }

  function Profile({ userId, onBack, theme }) {
    const [profile, setProfile] = useState(null); const [editMode, setEditMode] = useState(false);
    const [nick, setNick] = useState(''); const [bio, setBio] = useState('');
    const [shopOpen, setShopOpen] = useState(false); const [bannerOpen, setBannerOpen] = useState(false);
    const [giftTarget, setGiftTarget] = useState(''); const [giftType, setGiftType] = useState('heart'); const [giftDesc, setGiftDesc] = useState('');
    const [banners, setBanners] = useState([]);

    const load = () => api('/api/profile/' + (userId || ME.id)).then(p => { setProfile(p); setNick(p.custom_nick || ''); setBio(p.bio || ''); });
    useEffect(() => { load(); api('/api/banners').then(setBanners); }, [userId]);
    if (!profile) return e('div', {className:'loading'}, 'Загрузка...');
    const isMe = profile.id === ME.id;
    const save = async () => { await api('/api/profile', { method:'POST', body: JSON.stringify({ custom_nick: nick, bio: bio }) }); setEditMode(false); load(); };
    const buyFrame = async (f) => { try { await api('/api/buy_frame?frame='+f, {method:'POST'}); alert('Куплено!'); load(); } catch(e) { alert(e.message); } };
    const buyBanner = async (bid) => { try { await api('/api/buy_banner?banner_id='+bid, {method:'POST'}); alert('Куплено!'); load(); } catch(e) { alert(e.message); } };
    const buyGift = async () => { if(!giftTarget) return; try { await api('/api/buy_gift', { method:'POST', body: JSON.stringify({ to_id: parseInt(giftTarget), gift: giftType, description: giftDesc }) }); alert('Подарок отправлен!'); load(); } catch(e) { alert(e.message); } };

    const avatarUrl = profile.avatar ? `/api/avatar/${profile.avatar}` : `https://api.dicebear.com/7.x/adventurer/svg?seed=${profile.id}`;
    const refLink = `https://t.me/${tg.initDataUnsafe?.start_param ? 'bot' : 'bot'}?start=ref_${profile.id}`;

    return e('div', {className: `theme-${theme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
      profile.banner && profile.banner !== 'none' && e('img', { src: profile.banner, style: {width: '100%', borderRadius: 12, marginBottom: 8} }),
      e('div', { className: 'card', style: {textAlign: 'center'} },
        e('img', { src: avatarUrl, className: 'frame-'+profile.frame, style: {width: 100, height: 100, borderRadius: '50%', background:'rgba(0,0,0,0.5)', objectFit: 'cover'} }),
        e('h2', { style: {color: 'var(--accent)', margin: '16px 0 4px'} }, `${profile.badge || ''} ${profile.custom_nick || profile.first_name}`),
        e('p', { className: 'hint' }, `@${profile.username || 'no_username'} · ID: ${profile.id}`),
        e('p', { className: 'hint' }, `Был в сети: ${profile.last_seen ? timeMsk(profile.last_seen) : 'давно'}`),
        
        editMode ? e('div', {style: {marginTop:20}},
          e('input', { placeholder: 'Ник', value: nick, onChange: ev => setNick(ev.target.value) }),
          e('input', { placeholder: 'О себе', value: bio, onChange: ev => setBio(ev.target.value) }),
          e('button', { onClick: save, style: {width:'100%'} }, 'Сохранить')
        ) : e('div', {style: {marginTop:20}},
          e('p', { style: {fontStyle: 'italic', margin: '12px 0'} }, profile.bio || 'Тут пока пусто...'),
          isMe && e('button', { onClick: () => setEditMode(true), className: 'ghost', style: {width: '100%'} }, '✏️ Редактировать'),
          !isMe && e('button', { onClick: async () => { await api('/api/subscribe', {method:'POST', body: JSON.stringify({target_id: profile.id})}); load(); }, className: 'ghost', style: {width: '100%'} }, profile.is_subscribed ? '✓ Подписан' : '🔔 Подписаться')
        ),

        e('div', { className: 'row between', style: {marginTop: 24, background: 'rgba(0,0,0,0.4)', padding: 12, borderRadius: 12} },
          e('div', null, e('div', {className:'hint'}, 'Карма'), e('b', {style:{color:'var(--accent)'}}, profile.karma)),
          e('div', null, e('div', {className:'hint'}, 'Кристаллы'), e('b', null, profile.crystals)),
          e('div', null, e('div', {className:'hint'}, 'Постов'), e('b', null, profile.posts_count || 0))
        ),
        
        e('div', {style:{marginTop:24}}, 
          e('div', {className:'hint', marginBottom:8}, `Уровень ${profile.level}`), 
          e('div', {className:'level-bar'}, e('div', {className:'level-fill', style:{width: `${(profile.karma % 10) * 10}%`}}))
        ),

        profile.top_post && e('div', {style:{marginTop:24, textAlign:'left'}},
          e('div', {className:'hint', marginBottom:8}, '🔥 Самый популярный пост:'),
          e('div', {style:{background:'rgba(0,0,0,0.4)', padding:12, borderRadius:12}}, profile.top_post.title)
        ),

        e('div', {style:{marginTop:24}},
          e('div', {className:'hint', marginBottom:8}, '🏆 Достижения:'),
          profile.achievements?.length ? profile.achievements.map(a => e('span', {key: a, className: 'tag', style:{margin:4}}, a)) : e('span', {className:'hint'}, 'Пока нет')
        ),

        e('div', {style:{marginTop:24}},
          e('div', {className:'hint', marginBottom:8}, '🎁 Подарки:'),
          profile.gifts?.length ? profile.gifts.map((g, i) => e('div', {key: i, style:{margin:4}},
            e('span', {className:'tag'}, `${g.name === 'heart' ? '💖' : g.name === 'star' ? '⭐' : '👑'} от @${g.from}`),
            g.desc && e('div', {className:'hint', style:{fontSize:10}}, g.desc)
          )) : e('span', {className:'hint'}, 'Пока нет')
        ),

        isMe && e('div', {style:{marginTop:24}},
          e('button', { className: 'ghost', onClick: () => setShopOpen(!shopOpen), style:{width:'100%'} }, '🛍️ Магазин рамок'),
          shopOpen && e('div', {style:{marginTop:12, display:'flex', flexDirection:'column', gap:8}},
            e('button', { className: 'ghost', onClick: () => buyFrame('gold') }, '🥇 Золото (50 💎)'),
            e('button', { className: 'ghost', onClick: () => buyFrame('fire') }, '🔥 Огонь (100 💎)'),
            e('button', { className: 'ghost', onClick: () => buyFrame('sakura') }, '🌸 Сакура (150 💎)'),
            e('button', { className: 'ghost', onClick: () => buyFrame('anime') }, '🎨 Аниме (200 💎)'),
            e('button', { className: 'ghost', onClick: () => buyFrame('neon') }, '💡 Неон (250 💎)')
          )
        ),

        isMe && e('div', {style:{marginTop:24}},
          e('button', { className: 'ghost', onClick: () => setBannerOpen(!bannerOpen), style:{width:'100%'} }, '🖼️ Баннеры'),
          bannerOpen && banners.map(b => e('div', {key: b.id, style:{marginTop:12}},
            e('img', { src: b.image_url, style: {width:'100%', borderRadius:12, marginBottom:4} }),
            e('button', { className: 'ghost', onClick: () => buyBanner(b.id), style: {width: '100%'} }, `${b.name} (${b.price} 💎)`)
          ))
        ),

        isMe && e('div', {style:{marginTop:16, padding:12, background:'rgba(0,0,0,0.4)', borderRadius:12}},
          e('div', {className:'hint', marginBottom:4}, '🔗 Реф-ссылка:'),
          e('div', {style:{fontSize:12, wordBreak:'break-all', color:'var(--accent)'}}, refLink)
        ),

        isMe && e('div', {style:{marginTop:24, paddingTop:16, borderTop:'1px solid var(--border)'}},
          e('div', {className:'hint', marginBottom:8}, '🎁 Подарить (ID):'),
          e('input', { placeholder: 'ID', value: giftTarget, onChange: ev => setGiftTarget(ev.target.value) }),
          e('input', { placeholder: 'Подпись', value: giftDesc, onChange: ev => setGiftDesc(ev.target.value) }),
          e('select', { value: giftType, onChange: ev => setGiftType(ev.target.value), style: {width: '100%', padding: 14, borderRadius: 12, background: 'rgba(0,0,0,0.4)', color: '#fff', marginBottom: 12} },
            e('option', {value: 'heart'}, '💖 Сердечко (10💎)'),
            e('option', {value: 'star'}, '⭐ Звезда (30💎)'),
            e('option', {value: 'crown'}, '👑 Корона (100💎)')
          ),
          e('button', { onClick: buyGift, style: {width:'100%'} }, 'Отправить')
        )
      )
    );
  }

  function Games({ onBack, theme }) {
    const [tab, setTab] = useState('roulette');
    const [rouletteWin, setRouletteWin] = useState(null);
    const [bet, setBet] = useState(10);
    const [rocket, setRocket] = useState(null);
    const [caseResult, setCaseResult] = useState(null);

    const playRoulette = async () => { try { const r = await api('/api/games/roulette', {method:'POST'}); setRouletteWin(r.win); } catch(e) { alert(e.message); } };
    const playRocket = async () => { try { const r = await api('/api/games/rocket', {method:'POST', body: JSON.stringify({bet})}); setRocket(r); } catch(e) { alert(e.message); } };
    const playCase = async () => { try { const r = await api('/api/games/case', {method:'POST'}); setCaseResult(r.prize); } catch(e) { alert(e.message); } };

    return e('div', {className: `theme-${theme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
      e('h2', {style:{color:'var(--accent)'}}, '🎮 Игры'),
      e('div', {className: 'row', style: {marginBottom: 16}},
        e('button', { className: tab==='roulette' ? '' : 'ghost', onClick: () => setTab('roulette'), style: {flex:1} }, '🎰 Рулетка'),
        e('button', { className: tab==='rocket' ? '' : 'ghost', onClick: () => setTab('rocket'), style: {flex:1} }, '🚀 Ракета'),
        e('button', { className: tab==='case' ? '' : 'ghost', onClick: () => setTab('case'), style: {flex:1} }, '📦 Кейсы')
      ),
      tab === 'roulette' && e('div', {className: 'card'},
        e('h3', null, '🎰 Бесплатная рулетка (раз в 24ч)'),
        e('p', {className:'hint'}, 'Может выпасть 0, 1, 2, 5, 10 или 50 кристаллов.'),
        e('button', { onClick: playRoulette, style: {width:'100%'} }, 'Крутить'),
        rouletteWin !== null && e('h2', {style: {color:'var(--accent)', textAlign:'center', marginTop: 16}}, `Выигрыш: ${rouletteWin} 💎`)
      ),
      tab === 'rocket' && e('div', {className: 'card'},
        e('h3', null, '🚀 Ракета'),
        e('p', {className:'hint'}, 'Ставка растёт, но если не забрать — сгорит.'),
        e('input', { type: 'number', placeholder: 'Ставка (мин. 5)', value: bet, onChange: ev => setBet(parseInt(ev.target.value) || 0) }),
        e('button', { onClick: playRocket, style: {width:'100%'} }, 'Запустить'),
        rocket && e('div', {style:{marginTop:16, textAlign:'center'}},
          e('h2', {style: {color:'var(--accent)'}}, `x${rocket.crash}`),
          e('p', null, `Выигрыш: ${rocket.win} 💎`)
        )
      ),
      tab === 'case' && e('div', {className: 'card'},
        e('h3', null, '📦 Кейс (20 💎)'),
        e('p', {className:'hint'}, 'Внутри: кристаллы, рамки или ничего.'),
        e('button', { onClick: playCase, style: {width:'100%'} }, 'Открыть'),
        caseResult && e('h2', {style: {color:'var(--accent)', textAlign:'center', marginTop: 16}}, `Выпало: ${caseResult}`)
      )
    );
  }

  function Settings({ onBack, setTheme, currentTheme, music, setMusic, playlist, currentTrack, setCurrentTrack, searchTrack, setSearchTrack, support }) {
    const filteredPlaylist = playlist.filter((_, i) => i.toString().includes(searchTrack));
    return e('div', {className: `theme-${currentTheme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Назад'),
      e('h2', {style:{color:'var(--accent)'}}, '⚙️ Настройки'),
      e('div', { className: 'card' },
        e('h3', null, 'Темы'),
        e('div', { className: 'row', style: {flexWrap: 'wrap', gap: 8} },
          ['default', 'sakura', 'sunset', 'cyber', 'space'].map(t => e('button', {
            key: t, className: currentTheme === t ? '' : 'ghost', onClick: () => setTheme(t),
            style: {flex: 1, margin: 4, padding: '10px 0', textTransform: 'capitalize'}
          }, t))
        ),
        e('h3', {marginTop: 24}, 'Музыка'),
        e('button', { onClick: () => setMusic(!music), className: music ? '' : 'ghost', style: {width: '100%'} }, music ? '🔊 Выключить' : '🔇 Включить'),
        e('div', {style:{marginTop:16}},
          e('input', {placeholder: 'Поиск по номеру', value: searchTrack, onChange: ev => setSearchTrack(ev.target.value)}),
          filteredPlaylist.map((_, i) => {
            const idx = playlist.indexOf(_);
            return e('div', {key: idx, className: 'row between', style:{padding: 8, borderBottom: '1px solid var(--border)', cursor: 'pointer'}, onClick: () => setCurrentTrack(idx)},
              e('span', {style: {color: idx === currentTrack ? 'var(--accent)' : 'inherit'}}, `Трек ${idx + 1}`),
              idx === currentTrack && e('span', {className: 'hint'}, '🎵')
            )
          })
        ),
        e('h3', {marginTop: 24}, 'Поддержка'),
        e('a', { href: support, style: {color: 'var(--accent)'} }, 'Написать админу: ' + support)
      )
    );
  }

  function Compose({ onBack, onCreated, theme }) {
    const [title, setTitle] = useState(''); const [body, setBody] = useState(''); const [tags, setTags] = useState('general'); const [file, setFile] = useState(null); const [anon, setAnon] = useState(false); const [loading, setLoading] = useState(false);
    const submit = async () => {
      setLoading(true);
      try {
        let fileId = null;
        if (file) { const fd = new FormData(); fd.append('file', file); const res = await fetch('/api/upload', { method:'POST', headers: {'X-Init-Data': INIT}, body: fd }).then(r => r.json()); fileId = res.file_id; }
        await api('/api/posts', { method:'POST', body: JSON.stringify({ title, body, tags, image_file_id: fileId, is_anonymous: anon }) });
        alert('Отправлено!'); onCreated();
      } catch(e) { alert(e.message); } finally { setLoading(false); }
    };
    return e('div', {className: `theme-${theme}`},
      e('button', { className: 'ghost', onClick: onBack, style:{marginBottom:16} }, '← Отмена'),
      e('h2', { style: {color: 'var(--accent)'} }, 'Создать пост'),
      e('input', { placeholder: 'Заголовок', value: title, onChange: ev => setTitle(ev.target.value) }),
      e('input', { placeholder: 'Теги (до 3)', value: tags, onChange: ev => setTags(ev.target.value) }),
      e('textarea', { rows: 6, placeholder: 'Текст...', value: body, onChange: ev => setBody(ev.target.value) }),
      e('input', { type: 'file', accept: 'image/*,image/gif', onChange: ev => setFile(ev.target.files[0]), style:{color:'#fff'} }),
      e('label', {style: {display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12}},
        e('input', {type: 'checkbox', checked: anon, onChange: ev => setAnon(ev.target.checked), style: {width: 'auto'}}),
        ' Анонимно'
      ),
      e('button', { onClick: submit, style: {width:'100%'}, disabled: loading }, loading ? '...' : 'Опубликовать')
    );
  }

  function App() {
    const [route, setRoute] = useState({ view: 'list' });
    const [theme, setThemeState] = useState(localStorage.getItem('theme') || 'default');
    const [posts, setPosts] = useState([]);
    const [search, setSearch] = useState('');
    const [sort, setSort] = useState('new');
    const [music, setMusic] = useState(localStorage.getItem('music') === 'true');
    const [playlist, setPlaylist] = useState([]);
    const [currentTrack, setCurrentTrack] = useState(0);
    const [searchTrack, setSearchTrack] = useState('');
    const [support, setSupport] = useState('https://t.me/kvails');
    const [canRoulette, setCanRoulette] = useState(false);

    const reload = () => { api(`/api/posts?sort=${sort}${search ? `&q=${search}` : ''}`).then(d => setPosts(d.posts)); };
    useEffect(() => { reload(); }, [search, sort]);
    useEffect(() => { api('/api/playlist').then(setPlaylist); api('/api/support').then(s => setSupport(s.link)); }, []);

    useEffect(() => {
      const audio = document.getElementById('bg-music');
      if (music && playlist.length > 0) { audio.src = `/api/music/${currentTrack}`; audio.play().catch(() => {}); }
      else { audio.pause(); }
      localStorage.setItem('music', music);
    }, [music, currentTrack, playlist]);

    const setTheme = (t) => { setThemeState(t); localStorage.setItem('theme', t); };

    if (route.view === 'profile') return e(Profile, { userId: route.id, onBack: () => setRoute({view:'list'}), theme });
    if (route.view === 'post') return e(PostView, { id: route.id, onBack: () => setRoute({view:'list'}), onProfile: id => setRoute({view:'profile', id}), theme });
    if (route.view === 'compose') return e(Compose, { onBack: () => setRoute({view:'list'}), onCreated: () => setRoute({view:'list'}), theme });
    if (route.view === 'settings') return e(Settings, { onBack: () => setRoute({view:'list'}), setTheme, currentTheme: theme, music, setMusic, playlist, currentTrack, setCurrentTrack, searchTrack, setSearchTrack, support });
    if (route.view === 'games') return e(Games, { onBack: () => setRoute({view:'list'}), theme });

    return e('div', { className: `theme-${theme}` },
      e('div', { className: 'row between', style: {marginBottom: 20} },
        e('h1', { style: {margin: 0, color: '#fff', fontSize: 32}, onClick: reload }, '⛩️ RaReads'),
        e('div', {style: {display: 'flex', gap: 8}},
          e('button', { className: 'ghost', onClick: () => setRoute({view:'games'}), style: {position:'relative'} },
            '🎮', canRoulette && e('span', {className: 'red-dot'})
          ),
          e('button', { className: 'ghost', onClick: () => setRoute({view:'settings'}) }, '⚙️')
        )
      ),
      e('input', { placeholder: '🔍 Поиск по тегу...', value: search, onChange: ev => setSearch(ev.target.value) }),
      e('div', { className: 'row', style: {marginBottom: 20} },
        e('button', { className: sort === 'new' ? '' : 'ghost', onClick: () => setSort('new'), style: {flex: 1} }, '🆕 Недавнее'),
        e('button', { className: sort === 'day_top' ? '' : 'ghost', onClick: () => setSort('day_top'), style: {flex: 1} }, '🔥 Популярное')
      ),
      posts.map(p => e('div', { key: p.id, className: 'card', onClick: () => setRoute({view:'post', id: p.id}) },
        e('div', { className: 'row between' },
          e('span', { className: 'tag' }, p.tags.split(',').map(t => '#'+t.trim()).join(' ')),
          e('span', { className: 'hint' }, p.is_anonymous ? '🕶️ Аноним' : `${p.badge || ''} @${p.custom_nick || p.username} · ${timeMsk(p.created_at)}`)
        ),
        e('div', { className: 'title' }, p.title),
        e('div', { className: 'hint', marginTop: 8 }, `▲ ${p.score} · 💬 ${p.comments} · 👁 ${p.views}`),
        e('div', { style: {display: 'flex', gap: 4, marginTop: 8} }, Object.entries(p.reactions || {}).map(([r, c]) => e('span', {key: r, style: {background:'rgba(255,255,255,0.1)', padding: '2px 8px', borderRadius: 10, fontSize: 12}}, `${r} ${c}`)))
      )),
      e('button', { className: 'fab', onClick: () => setRoute({view:'compose'}) }, '+'),
      e('button', { className: 'fab-profile', onClick: () => setRoute({view:'profile', id: ME.id}) }, '👤')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
